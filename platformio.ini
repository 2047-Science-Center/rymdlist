; ============================================================
;  Rymdlist — ESP32 + WS2812B, live-styrd från mobilen
;  PlatformIO / Arduino-framework
; ============================================================
;
;  Byt board med `default_envs` nedan om du kör ett annat kort
;  (t.ex. esp32-c3-devkitm-1, lolin_s2_mini, seeed_xiao_esp32c3).
;  LED_PIN i src/config.h måste peka på en giltig GPIO för kortet.

[platformio]
default_envs = esp32dev

; --- Gemensamma inställningar för alla ESP32-kort ---
[common]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.1.0
    ; ESPAsyncWebServer + AsyncTCP — Mathieu Carbous aktivt underhållna
    ; forkar (drar in rätt AsyncTCP automatiskt). Den de facto-standard
    ; som bygger rent på nuvarande Arduino-ESP32-kärna.
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0

; --- Standardkort: klassisk ESP32 DevKit ---
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

; --- Exempel: ESP32-C3 (avkommentera och sätt default_envs = esp32c3) ---
; [env:esp32c3]
; platform = espressif32
; board = esp32-c3-devkitm-1
; framework = ${common.framework}
; monitor_speed = ${common.monitor_speed}
; build_flags = ${common.build_flags}
; lib_deps = ${common.lib_deps}
