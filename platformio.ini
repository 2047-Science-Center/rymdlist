; ============================================================
;  Rymdlist — WS2812B-ledlist, live-styrd från mobilen
;  PlatformIO / Arduino-framework. Två kort stöds:
;    * esp32dev   — vanligt ESP32 WROOM-devkit
;    * nodemcuv2  — NodeMCU/Amica ESP8266 (ESP-12E)
;  Byt vilket kort `pio run`/upload använder som standard via default_envs,
;  eller kör ett specifikt: `pio run -e nodemcuv2 -t upload`.
; ============================================================

[platformio]
default_envs = nodemcuv2      ; ditt kort just nu (Amica ESP8266)

; --- Gemensamt för alla kort ---
[common]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.1.0

; --- ESP32 WROOM-devkit ---
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
lib_deps =
    ${common.lib_deps}
    ; ESPAsyncWebServer + AsyncTCP — Mathieu Carbous aktivt underhållna forkar
    ; (drar in rätt AsyncTCP). Bygger rent på nuvarande Arduino-ESP32-kärna.
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
; Större app-partition (3 MB app / 1 MB fs, ingen OTA). WiFi+webbserver+FastLED
; fyller nästan hela standardpartitionen — detta ger plats för framtida MQTT.
board_build.partitions = huge_app.csv

; --- NodeMCU / Amica ESP8266 (ESP-12E) ---
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
lib_deps =
    ${common.lib_deps}
    ; ESP8266-kompatibel async-stack (esphome-forken drar in ESPAsyncTCP för 8266).
    esphome/ESPAsyncWebServer-esphome @ ^3.3.0

; --- Exempel: ESP32-C3 (avkommentera och sätt default_envs = esp32c3) ---
; [env:esp32c3]
; platform = espressif32
; board = esp32-c3-devkitm-1
; framework = ${common.framework}
; monitor_speed = ${common.monitor_speed}
; build_flags = ${common.build_flags}
; lib_deps =
;     ${common.lib_deps}
